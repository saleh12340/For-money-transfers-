plugins { id 'com.android.application' }

android {
    namespace 'com.saleh.tahweelati'
    compileSdk 35

    defaultConfig {
        applicationId 'com.saleh.tahweelati'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        debugConfig {
            def ks = file("${rootDir}/debug.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            if (file("${rootDir}/debug.keystore").exists()) {
                signingConfig signingConfigs.debugConfig
            }
        }
    }
}
