<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منسّق الحوالات السريع</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
        }
        .toast {
            transition: all 0.25s ease-in-out;
            transform: translateY(-50px);
            opacity: 0;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-1.5 sm:p-3">

    <!-- Toast Notification Box -->
    <div id="toast" class="toast fixed top-2 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-amber-300 border border-slate-700 text-xs px-3 py-1.5 rounded-lg shadow-xl flex items-center gap-2 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg" class="font-bold">تم إجراء العملية بنجاح</span>
    </div>

    <!-- Compact Container -->
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-2 sm:p-3">
        
        <!-- Header Bar -->
        <div class="flex items-center justify-between gap-1.5 bg-slate-900 text-white p-2 rounded-lg mb-2">
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-bolt text-amber-400 text-sm"></i>
                <h1 class="text-xs sm:text-sm font-bold tracking-tight">منسّق الحوالات السريع</h1>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-1">
                <button id="fillSampleBtn" title="تعبئة نموذج تجريبي" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2 py-1 rounded text-[11px] font-semibold transition flex items-center gap-1 active:scale-95">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                    <span>مثال</span>
                </button>
                <button id="clearBtn" title="مسح الحقول" class="bg-red-950/70 hover:bg-red-900 text-red-300 hover:text-red-100 px-2 py-1 rounded text-[11px] font-semibold transition flex items-center gap-1 active:scale-95">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>مسح</span>
                </button>
            </div>
        </div>

        <!-- Content Layout: Compact 2 Column Grid -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2 items-start">
            
            <!-- Compact Form Inputs (7 Cols) -->
            <form id="transferForm" class="md:col-span-7 grid grid-cols-2 gap-1.5 text-xs" onsubmit="event.preventDefault();">
                
                <!-- Amount Field -->
                <div class="col-span-2">
                    <label class="block font-bold text-slate-700 text-[11px] mb-0.5">المبلغ (أرقام)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-2 text-slate-400 text-xs">
                            <i class="fa-solid fa-money-bill-wave"></i>
                        </span>
                        <input type="text" id="amount" inputmode="numeric" placeholder="أدخل المبلغ" autocomplete="off"
                            class="w-full pr-7 pl-12 py-1 bg-slate-50 border border-slate-300 rounded-md focus:ring-1 focus:ring-emerald-500 focus:bg-white outline-none font-bold text-slate-800 text-xs transition">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-1.5 text-[10px] text-slate-600 font-bold bg-slate-200/80 rounded-l-md px-1.5 border-r border-slate-300">
                            صافي
                        </span>
                    </div>
                </div>

                <!-- Recipient Name -->
                <div>
                    <label class="block font-bold text-slate-700 text-[11px] mb-0.5">اسم المستلم</label>
                    <input type="text" id="recipientName" placeholder="أدخل اسم المستلم" autocomplete="off"
                        class="w-full px-2 py-1 bg-slate-50 border border-slate-300 rounded-md focus:ring-1 focus:ring-emerald-500 focus:bg-white outline-none text-xs transition">
                </div>

                <!-- Recipient Phone with Contact Picker -->
                <div>
                    <label class="block font-bold text-slate-700 text-[11px] mb-0.5">رقم المستلم</label>
                    <div class="relative flex items-center">
                        <input type="tel" id="recipientPhone" placeholder="أدخل رقم المستلم" dir="ltr" autocomplete="off"
                            class="w-full pr-2 pl-8 py-1 bg-slate-50 border border-slate-300 rounded-md focus:ring-1 focus:ring-emerald-500 focus:bg-white outline-none text-right text-xs font-mono transition">
                        <button type="button" id="pickRecipientContactBtn" onclick="pickContact('recipient')"
                            title="اختيار من جهات الاتصال"
                            class="absolute left-1 p-1 text-slate-500 hover:text-indigo-600 active:scale-95 transition rounded hover:bg-slate-200">
                            <i class="fa-solid fa-address-book text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Sender Name -->
                <div>
                    <label class="block font-bold text-slate-700 text-[11px] mb-0.5">اسم المرسل</label>
                    <input type="text" id="senderName" placeholder="أدخل اسم المرسل" autocomplete="off"
                        class="w-full px-2 py-1 bg-slate-50 border border-slate-300 rounded-md focus:ring-1 focus:ring-emerald-500 focus:bg-white outline-none text-xs transition">
                </div>

                <!-- Sender Phone with Contact Picker -->
                <div>
                    <label class="block font-bold text-slate-700 text-[11px] mb-0.5">رقم المرسل</label>
                    <div class="relative flex items-center">
                        <input type="tel" id="senderPhone" placeholder="أدخل رقم المرسل" dir="ltr" maxlength="14" autocomplete="off"
                            class="w-full pr-2 pl-8 py-1 bg-slate-50 border border-slate-300 rounded-md focus:ring-1 focus:ring-emerald-500 focus:bg-white outline-none text-right text-xs font-mono transition">
                        <button type="button" id="pickSenderContactBtn" onclick="pickContact('sender')"
                            title="اختيار من جهات الاتصال"
                            class="absolute left-1 p-1 text-slate-500 hover:text-indigo-600 active:scale-95 transition rounded hover:bg-slate-200">
                            <i class="fa-solid fa-address-book text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Hidden Target WhatsApp Phone Input (Hidden from UI as requested) -->
                <input type="hidden" id="targetWhatsAppPhone" value="776425052">

            </form>

            <!-- Output Preview Box (5 Cols) -->
            <div class="md:col-span-5">
                <div class="bg-slate-900 text-slate-100 rounded-lg p-2 border border-slate-800 shadow-sm flex flex-col gap-1.5">
                    
                    <!-- Action Buttons Directly ABOVE Preview Box -->
                    <div class="flex items-center justify-between gap-1 border-b border-slate-800 pb-1.5">
                        <span class="text-[10px] font-bold text-emerald-400 flex items-center gap-1">
                            <i class="fa-solid fa-align-right text-[10px]"></i> النص المنسق / منطقة اللصق
                        </span>

                        <div class="flex items-center gap-1">
                            <!-- Paste Button -->
                            <button id="pasteBtn" type="button" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-2 py-1 rounded text-[11px] font-bold flex items-center gap-1 shadow transition" title="لصق نص الحوالة واستخراج البيانات أوتوماتيكياً">
                                <i class="fa-regular fa-paste text-[10px]"></i>
                                <span>لصق</span>
                            </button>

                            <!-- Copy Button -->
                            <button id="copyBtn" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-2.5 py-1 rounded text-[11px] font-bold flex items-center gap-1 shadow transition">
                                <i class="fa-regular fa-copy text-[10px]"></i>
                                <span>نسخ</span>
                            </button>

                            <!-- Official WhatsApp Button -->
                            <button id="whatsappBtn" class="bg-teal-600 hover:bg-teal-500 active:scale-95 text-white px-2.5 py-1 rounded text-[11px] font-bold flex items-center gap-1 shadow transition">
                                <i class="fa-brands fa-whatsapp text-[11px]"></i>
                                <span>واتساب</span>
                            </button>
                        </div>
                    </div>

                    <!-- Interactive Textarea for Output AND Direct Paste -->
                    <textarea id="outputText" rows="5" placeholder="قم بلصق نص الحوالة هنا لاستخراج البيانات أوتوماتيكياً..."
                        class="w-full bg-slate-950 text-emerald-300 font-mono text-[11px] p-2 rounded-md border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition resize-none leading-relaxed"></textarea>
                </div>
            </div>

        </div>

        <!-- Read-Only History Review Section -->
        <div class="mt-3 border-t border-slate-200 pt-2">
            <div class="flex items-center justify-between mb-1.5 px-1">
                <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i>
                    سجل الحوالات المحفوظة (للمراجعة فقط)
                </span>
                <span id="historyCounter" class="bg-indigo-100 text-indigo-800 text-[10px] font-bold px-2 py-0.5 rounded-full">
                    0 حوالة
                </span>
            </div>

            <!-- List of Saved Transfers -->
            <div id="historyList" class="space-y-1.5 max-h-52 overflow-y-auto pr-0.5 text-xs">
                <div class="text-center py-3 text-slate-400 text-[11px] bg-slate-50 rounded-lg border border-dashed border-slate-300">
                    لا توجد حوالات في السجل بعد. يتم الحفظ تلقائياً فور اكتمال جميع الحقول الأساسية.
                </div>
            </div>
        </div>

    </div>

    <!-- Hidden Textarea for Copy Fallback -->
    <textarea id="hiddenCopyInput" class="sr-only" aria-hidden="true"></textarea>

    <script>
        // DOM Elements References
        const amountInput = document.getElementById('amount');
        const recipientNameInput = document.getElementById('recipientName');
        const recipientPhoneInput = document.getElementById('recipientPhone');
        const senderNameInput = document.getElementById('senderName');
        const senderPhoneInput = document.getElementById('senderPhone');
        const targetWhatsAppPhoneInput = document.getElementById('targetWhatsAppPhone');
        
        const outputText = document.getElementById('outputText');
        const copyBtn = document.getElementById('copyBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const whatsappBtn = document.getElementById('whatsappBtn');
        const clearBtn = document.getElementById('clearBtn');
        const fillSampleBtn = document.getElementById('fillSampleBtn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const hiddenCopyInput = document.getElementById('hiddenCopyInput');
        const historyList = document.getElementById('historyList');
        const historyCounter = document.getElementById('historyCounter');

        // History Data Storage
        let savedHistory = [];
        let lastSavedSignature = '';
        let isInternalUpdate = false;

        // Formats numbers with commas (e.g. 47400 -> 47,400)
        function formatNumberWithCommas(str) {
            if (!str) return '';
            const cleanStr = str.toString().replace(/[^0-9]/g, '');
            if (!cleanStr) return '';
            return parseInt(cleanStr, 10).toLocaleString('en-US');
        }

        // Convert Eastern Arabic numbers (٠١٢٣٤٥٦٧٨٩) to standard digits
        function normalizeDigits(str) {
            if (!str) return '';
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        }

        // Contacts Picker Integration (AndroidBridge + Web Contacts API fallback)
        window.pickContact = async function(targetField) {
            if (window.AndroidBridge && window.AndroidBridge.pickContact) {
                window.AndroidBridge.pickContact(targetField);
                return;
            }

            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const props = ['tel'];
                    const opts = { multiple: false };
                    const contacts = await navigator.contacts.select(props, opts);
                    if (contacts && contacts.length > 0) {
                        const contact = contacts[0];
                        let tel = (contact.tel && contact.tel[0]) ? contact.tel[0] : '';
                        tel = tel.replace(/[^0-9]/g, '');
                        if (tel.startsWith('967') && tel.length > 9) {
                            tel = tel.substring(3);
                        }
                        window.onContactSelected(targetField, '', tel);
                        return;
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            showToast('اختر جهة الاتصال من الجهاز (متاح في تطبيق الأندرويد)');
        };

        // Callback invoked when contact is chosen (imports phone ONLY)
        window.onContactSelected = function(targetField, name, rawPhone) {
            let phone = normalizeDigits(rawPhone || '').replace(/[^0-9]/g, '');
            if (phone.startsWith('967') && phone.length > 9) {
                phone = phone.substring(3);
            }
            if (phone.startsWith('00967') && phone.length > 11) {
                phone = phone.substring(5);
            }

            if (!phone) {
                showToast('لم يتم العثور على رقم هاتف في جهة الاتصال');
                return;
            }

            if (targetField === 'recipient') {
                recipientPhoneInput.value = phone;
            } else if (targetField === 'sender') {
                senderPhoneInput.value = phone;
            }

            updateOutput();
            showToast('تم استيراد رقم الهاتف بنجاح 📱');
        };

        // Parse pasted raw text and auto-fill corresponding inputs
        function parseAndFillText(pastedText) {
            if (!pastedText || typeof pastedText !== 'string') return false;
            
            const normalizedText = normalizeDigits(pastedText);
            const rawLines = normalizedText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (rawLines.length === 0) return false;

            let extractedAmount = '';
            let extractedRecipientName = '';
            let extractedRecipientPhone = '';
            let extractedSenderName = '';
            let extractedSenderPhone = '';

            let foundAny = false;

            rawLines.forEach(line => {
                if (/المستلم/i.test(line)) {
                    extractedRecipientName = line.replace(/^(المستلم|اسم المستلم)[\s:\-]*/i, '').trim();
                    foundAny = true;
                } else if (/المرسل/i.test(line)) {
                    extractedSenderName = line.replace(/^(المرسل|اسم المرسل)[\s:\-]*/i, '').trim();
                    foundAny = true;
                } else if (/صافي/i.test(line) || (/^[\d,.\s]+$/.test(line) && !extractedAmount && line.length <= 12)) {
                    const cleanAmt = line.replace(/صافي/g, '').replace(/[^\d]/g, '');
                    if (cleanAmt && cleanAmt.length >= 3) {
                        extractedAmount = cleanAmt;
                        foundAny = true;
                    }
                } else {
                    const phoneNum = line.replace(/[^\d]/g, '');
                    if (phoneNum.length >= 7 && phoneNum.length <= 14) {
                        if (!extractedRecipientPhone) {
                            extractedRecipientPhone = phoneNum;
                            foundAny = true;
                        } else if (!extractedSenderPhone) {
                            extractedSenderPhone = phoneNum;
                            foundAny = true;
                        }
                    }
                }
            });

            if (foundAny) {
                if (extractedAmount) amountInput.value = formatNumberWithCommas(extractedAmount);
                if (extractedRecipientName) recipientNameInput.value = extractedRecipientName;
                if (extractedRecipientPhone) recipientPhoneInput.value = extractedRecipientPhone;
                if (extractedSenderName) senderNameInput.value = extractedSenderName;
                if (extractedSenderPhone) senderPhoneInput.value = extractedSenderPhone;

                updateOutput();
                showToast('تم استخراج وتعبئة الحقول وحفظها بنجاح! ✨');
                return true;
            }
            return false;
        }

        // Handle Paste Action from Button
        async function handlePasteAction() {
            try {
                if (window.AndroidBridge && window.AndroidBridge.getClipboardText) {
                    const text = window.AndroidBridge.getClipboardText();
                    if (text && parseAndFillText(text)) {
                        return;
                    }
                }
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text && parseAndFillText(text)) {
                        return;
                    }
                }
            } catch (err) {
                // Clipboard API blocked or restricted
            }

            const pasted = prompt('قم بلصق نص الحوالة هنا لتوزيع البيانات تلقائياً:');
            if (pasted) {
                if (!parseAndFillText(pasted)) {
                    showToast('تعذر استخراج بيانات الحوالة من النص.');
                }
            }
        }

        // Listen for direct Paste events on outputText box
        outputText.addEventListener('paste', (e) => {
            const pastedText = (e.clipboardData || window.clipboardData)?.getData('text');
            if (pastedText && parseAndFillText(pastedText)) {
                e.preventDefault();
            }
        });

        // Listen for typing/pasting directly into outputText
        outputText.addEventListener('input', (e) => {
            if (isInternalUpdate) return;
            const textVal = e.target.value;
            if (textVal) {
                parseAndFillText(textVal);
            }
        });

        // Generate formatted text strictly matching required format
        function generateFormattedText() {
            const amountVal = amountInput.value.trim();
            const amountText = amountVal ? `${amountVal} صافي` : '';
            
            const recipientName = recipientNameInput.value.trim();
            const recipientPhone = normalizeDigits(recipientPhoneInput.value.trim());
            
            const senderName = senderNameInput.value.trim();
            const senderPhone = normalizeDigits(senderPhoneInput.value.trim());

            const lines = [];
            if (amountText) lines.push(amountText);
            if (recipientName) lines.push(`المستلم ${recipientName}`);
            if (recipientPhone) lines.push(recipientPhone);
            if (senderName) lines.push(`المرسل ${senderName}`);
            if (senderPhone) lines.push(senderPhone);

            return lines.join('\n');
        }

        // Update Output Display and trigger auto-save check
        function updateOutput() {
            isInternalUpdate = true;
            const formatted = generateFormattedText();
            outputText.value = formatted;
            isInternalUpdate = false;
            checkAndAutoSave();
        }

        // Auto Save to Log when ALL core fields are complete
        function checkAndAutoSave() {
            const amountVal = amountInput.value.trim();
            const recipientName = recipientNameInput.value.trim();
            const rawRecipientPhone = normalizeDigits(recipientPhoneInput.value.trim()).replace(/[^0-9]/g, '');
            const senderName = senderNameInput.value.trim();
            const rawSenderPhone = normalizeDigits(senderPhoneInput.value.trim()).replace(/[^0-9]/g, '');

            // شرط الحفظ التلقائي: اكتمال جميع الحقول الأساسية
            const isAmountValid = amountVal.length > 0;
            const isRecipientNameValid = recipientName.length >= 2;
            const isRecipientPhoneValid = rawRecipientPhone.length >= 7;
            const isSenderNameValid = senderName.length >= 2;
            const isSenderPhoneValid = rawSenderPhone.length >= 7;

            if (isAmountValid && isRecipientNameValid && isRecipientPhoneValid && isSenderNameValid && isSenderPhoneValid) {
                const fullContent = generateFormattedText();
                const signature = `${amountVal}|${recipientName}|${rawRecipientPhone}|${senderName}|${rawSenderPhone}`;

                if (signature !== lastSavedSignature) {
                    lastSavedSignature = signature;
                    
                    const now = new Date();
                    const dateStr = now.toLocaleDateString('ar-YE', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    const timeStr = now.toLocaleTimeString('ar-YE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    const record = {
                        id: Date.now(),
                        dateStr: dateStr,
                        timeStr: timeStr,
                        amount: amountVal,
                        recipientName: recipientName,
                        recipientPhone: rawRecipientPhone,
                        senderName: senderName,
                        senderPhone: rawSenderPhone,
                        fullText: fullContent,
                        isPrepared: false
                    };

                    savedHistory.unshift(record);
                    try {
                        localStorage.setItem('transferHistoryRecords', JSON.stringify(savedHistory));
                    } catch(e) {}
                    renderHistoryLog();
                    showToast('تم حفظ الحوالة تلقائياً في السجل 💾');
                }
            }
        }

        // Mark Transfer as Prepared (One-time irreversible action)
        window.markAsPrepared = window.toggleTransferStatus = function(id) {
            const item = savedHistory.find(h => h.id === id);
            if (item) {
                if (item.isPrepared) {
                    return; // مقفلة نهائياً لا يمكن إلغاؤها
                }
                item.isPrepared = true;
                try {
                    localStorage.setItem('transferHistoryRecords', JSON.stringify(savedHistory));
                } catch(e) {}
                renderHistoryLog();
                showToast('تم تجهيز الحوالة وتثبيت الحالة نهائياً ✅');
            }
        };

        // Render History Log (Read-Only Review)
        function renderHistoryLog() {
            historyCounter.textContent = `${savedHistory.length} حوالة`;

            if (savedHistory.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center py-3 text-slate-400 text-[11px] bg-slate-50 rounded-lg border border-dashed border-slate-300">
                        لا توجد حوالات في السجل بعد. يتم الحفظ تلقائياً فور اكتمال جميع الحقول الأساسية.
                    </div>
                `;
                return;
            }

            historyList.innerHTML = savedHistory.map(item => {
                const isPrepared = !!item.isPrepared;
                if (!isPrepared) {
                    // الحوالات غير المجهزة (غير المكتملة):
                    // - تظهر بخلفية حمراء بارزة (bg-red-100)
                    // - لون الخط والنصوص باللون الأزرق والأخضر الغامق
                    // - زر تفاعلي باللون الأحمر: غير مجهزة (انقر للتجهيز)
                    return `
                        <div class="bg-red-100 border-2 border-red-300 rounded-lg p-2.5 shadow-sm relative transition-all">
                            <div class="flex items-center justify-between border-b border-red-200 pb-1.5 mb-1.5 gap-1">
                                <span class="text-[10px] font-bold text-blue-900 bg-red-200/80 px-1.5 py-0.5 rounded border border-red-300 flex items-center gap-1">
                                    <i class="fa-regular fa-calendar-check text-blue-800"></i> ${item.dateStr} - ${item.timeStr}
                                </span>
                                
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[11px] font-black text-emerald-950 bg-emerald-100 px-2 py-0.5 rounded border border-emerald-300 tracking-wide">
                                        ${item.amount} صافي
                                    </span>
                                    <button onclick="toggleTransferStatus(${item.id})" type="button"
                                        class="bg-red-600 hover:bg-red-700 text-white px-2 py-0.5 rounded text-[10px] font-bold flex items-center gap-1 active:scale-95 transition shadow">
                                        <i class="fa-solid fa-hourglass-half text-white"></i>
                                        <span>غير مجهزة (انقر للتجهيز)</span>
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-1.5 text-[11px] leading-tight">
                                <div>
                                    <strong class="text-blue-950 font-bold">المستلم:</strong>
                                    <span class="text-emerald-900 font-extrabold">${item.recipientName || '-'}</span>
                                </div>
                                <div dir="ltr" class="text-right font-mono">
                                    <strong class="text-blue-950 font-sans font-bold">رقم المستلم:</strong>
                                    <span class="text-emerald-900 font-bold">${item.recipientPhone || '-'}</span>
                                </div>
                                <div>
                                    <strong class="text-blue-950 font-bold">المرسل:</strong>
                                    <span class="text-emerald-900 font-extrabold">${item.senderName || '-'}</span>
                                </div>
                                <div dir="ltr" class="text-right font-mono">
                                    <strong class="text-blue-950 font-sans font-bold">رقم المرسل:</strong>
                                    <span class="text-emerald-900 font-bold">${item.senderPhone || '-'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // الحوالات المجهزة (تم تجهيزها):
                    // - خلفية بيضاء مع حدود رمادية
                    // - لون الكتابة والخط باللون الأسود البارز والواضح
                    // - زر رمادي مغلق: مجهزة (جاهزة)
                    return `
                        <div class="bg-white border-2 border-slate-300 rounded-lg p-2.5 text-black shadow-sm relative transition-all">
                            <div class="flex items-center justify-between border-b border-slate-200 pb-1.5 mb-1.5 gap-1">
                                <span class="text-[10px] font-black text-black bg-slate-100 px-1.5 py-0.5 rounded border border-slate-300 flex items-center gap-1">
                                    <i class="fa-regular fa-calendar-check text-black"></i> ${item.dateStr} - ${item.timeStr}
                                </span>
                                
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[11px] font-black text-black bg-slate-100 px-2 py-0.5 rounded border border-slate-300 tracking-wide">
                                        ${item.amount} صافي
                                    </span>
                                    <button type="button" disabled
                                        class="bg-slate-200 text-slate-700 border border-slate-400 px-2 py-0.5 rounded text-[10px] font-bold flex items-center gap-1 cursor-default opacity-90 shadow-none select-none"
                                        title="تم التجهيز وتثبيت الحالة نهائياً">
                                        <i class="fa-solid fa-circle-check text-slate-600"></i>
                                        <span>مجهزة (جاهزة)</span>
                                        <i class="fa-solid fa-lock text-[9px] text-slate-500 mr-0.5"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-1.5 text-[11px] leading-tight text-black">
                                <div>
                                    <strong class="text-black font-black">المستلم:</strong>
                                    <span class="text-black font-black">${item.recipientName || '-'}</span>
                                </div>
                                <div dir="ltr" class="text-right font-mono">
                                    <strong class="text-black font-sans font-black">رقم المستلم:</strong>
                                    <span class="text-black font-black">${item.recipientPhone || '-'}</span>
                                </div>
                                <div>
                                    <strong class="text-black font-black">المرسل:</strong>
                                    <span class="text-black font-black">${item.senderName || '-'}</span>
                                </div>
                                <div dir="ltr" class="text-right font-mono">
                                    <strong class="text-black font-sans font-black">رقم المرسل:</strong>
                                    <span class="text-black font-black">${item.senderPhone || '-'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        // Live Amount Number Formatting Listener
        amountInput.addEventListener('input', (e) => {
            const rawValue = e.target.value;
            const formatted = formatNumberWithCommas(rawValue);
            e.target.value = formatted;
            updateOutput();
        });

        // Auto-select text on focus and click for rapid editing
        [amountInput, recipientNameInput, recipientPhoneInput, senderNameInput, senderPhoneInput].forEach(element => {
            element?.addEventListener('input', updateOutput);
            
            element?.addEventListener('focus', function() {
                this.select();
            });
            element?.addEventListener('click', function() {
                this.select();
            });
        });

        // Copy Text Function
        function copyToClipboard() {
            const textToCopy = generateFormattedText();
            if (!textToCopy) {
                showToast('يرجى إدخال البيانات أولاً!');
                return;
            }

            if (window.AndroidBridge && window.AndroidBridge.copyToClipboard) {
                window.AndroidBridge.copyToClipboard(textToCopy);
            }

            hiddenCopyInput.value = textToCopy;
            hiddenCopyInput.select();
            hiddenCopyInput.setSelectionRange(0, 99999);

            let successful = false;
            try {
                successful = document.execCommand('copy');
            } catch (err) {
                successful = false;
            }

            if (!successful && navigator.clipboard) {
                navigator.clipboard.writeText(textToCopy);
                successful = true;
            }

            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i> <span>تم!</span>`;
            copyBtn.classList.replace('bg-emerald-600', 'bg-emerald-700');
            
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
                copyBtn.classList.replace('bg-emerald-700', 'bg-emerald-600');
            }, 1500);

            showToast('تم النسخ إلى الحافظة بنجاح!');
        }

        // Official Direct WhatsApp Sharing
        function shareOnWhatsApp() {
            const text = generateFormattedText();
            if (!text) {
                showToast('يرجى إدخال بيانات الحوالة أولاً!');
                return;
            }
            
            let targetPhone = targetWhatsAppPhoneInput ? normalizeDigits(targetWhatsAppPhoneInput.value.trim()).replace(/[^0-9]/g, '') : '776425052';
            if (!targetPhone) {
                targetPhone = '776425052';
            }
            
            let destPhone = targetPhone;
            if (destPhone.length === 9) {
                destPhone = '967' + destPhone;
            }

            if (window.AndroidBridge && window.AndroidBridge.openWhatsApp) {
                window.AndroidBridge.openWhatsApp(destPhone, text);
                showToast('جاري الفتح في واتساب...');
                return;
            }

            const encodedText = encodeURIComponent(text);
            const waUrl = `https://api.whatsapp.com/send?phone=${destPhone}&text=${encodedText}`;
            window.open(waUrl, '_blank');
        }

        // Fill Sample Data
        function fillSampleData() {
            amountInput.value = formatNumberWithCommas('47400');
            recipientNameInput.value = 'محمد احمد محمد الضبياني';
            recipientPhoneInput.value = '770386186';
            senderNameInput.value = 'بكيل علي قاسم الضبياني';
            senderPhoneInput.value = '780451254';
            updateOutput();
            showToast('تم تعبئة نموذج تجريبي!');
        }

        // Clear All Inputs
        function clearForm() {
            amountInput.value = '';
            recipientNameInput.value = '';
            recipientPhoneInput.value = '';
            senderNameInput.value = '';
            senderPhoneInput.value = '';
            lastSavedSignature = '';
            updateOutput();
            showToast('تم مسح جميع الحقول');
        }

        // Toast Message Handler
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        // Event Listeners
        copyBtn.addEventListener('click', copyToClipboard);
        pasteBtn.addEventListener('click', handlePasteAction);
        whatsappBtn.addEventListener('click', shareOnWhatsApp);
        clearBtn.addEventListener('click', clearForm);
        fillSampleBtn.addEventListener('click', fillSampleData);

        // Initialization
        window.onload = function() {
            try {
                const stored = localStorage.getItem('transferHistoryRecords');
                if (stored) {
                    savedHistory = JSON.parse(stored);
                    savedHistory.forEach(item => {
                        if (typeof item.isPrepared === 'undefined') {
                            item.isPrepared = false;
                        }
                    });
                }
            } catch(e) {}
            updateOutput();
            renderHistoryLog();
        };
    </script>
</body>
</html>
